<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto | Laura Gómez</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="contacto.css">
</head>
<body>
    <div class="background-overlay"></div>

    <nav class="navbar">
        <div class="logo">
            <h1>ENZO REYNOSO</h1>
            <span>WEB DEVELOPER</span>
        </div>
        <ul class="nav-links">
            <li><a href="index.html">Inicio</a></li>
            <li><a href="index.html#projects">Proyectos</a></li>
            <li><a href="constancia.html">Certificado</a></li>
            <li><a href="contacto.html">Contacto</a></li>
        </ul>
    </nav>

    <main class="contact-wrapper fade-in">
        <section class="glass contact-card">
            <header class="contact-header">
                <h2>¿Tienes un <span class="highlight">proyecto</span> en mente?</h2>
                <p>Escríbeme y charlemos sobre cómo puedo ayudarte.</p>
            </header>

            <form action="https://formspree.io/f/mvzadgbo" method="POST" id="contact-form" class="form-container">
    <div class="input-group">
        <label for="name">Nombre</label>
        <input type="text" id="name" name="name" placeholder="Tu nombre" required>
    </div>

    <div class="input-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="_replyto" placeholder="tu@email.com" required>
    </div>

    <div class="input-group">
        <label for="message">Mensaje</label>
        <textarea id="message" name="message" placeholder="Cuéntame sobre tu idea..." required></textarea>
    </div>

    <button type="submit" class="btn-main full-width">
        Enviar Mensaje <i class="fas fa-paper-plane"></i>
    </button>
</form>
        </section>
    </main>
        <div class="social-sidebar">
            <a href="mailto:tu-email@gmail.com" class="social-icon gmail" title="Gmail">
                <i class="fas fa-envelope"></i>
            </a>
            <a href="https://wa.me/tu-numero" target="_blank" class="social-icon whatsapp" title="WhatsApp">
                <i class="fab fa-whatsapp"></i>
            </a>
            <a href="https://github.com/tu-usuario" target="_blank" class="social-icon github" title="GitHub">
                <i class="fab fa-github"></i>
            </a>
        </div>

    <script src="script.js"></script>
</body>
</html>
